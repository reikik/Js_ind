<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>Мои Задачи</h1>
        </header>

        <!-- Форма добавления (Критерий: Валидация и ввод) -->
        <form id="todo-form">
            <div class="input-group">
                <input type="text" id="task-input" placeholder="Что нужно сделать?" autocomplete="off">
                <select id="priority-select">
                    <option value="low">Низкий приоритет</option>
                    <option value="medium" selected>Средний приоритет</option>
                    <option value="high">Высокий приоритет</option>
                </select>
                <button type="submit">Добавить</button>
            </div>
            <div id="error-message" class="error-msg hidden"></div>
        </form>

        <!-- Фильтры и Сортировка (Критерий: Работа с массивами) -->
        <div class="controls">
            <input type="text" id="search-input" placeholder="Поиск задач...">
            
            <div class="filter-buttons">
                <button class="filter-btn active" data-filter="all">Все</button>
                <button class="filter-btn" data-filter="active">Текущие</button>
                <button class="filter-btn" data-filter="completed">Завершенные</button>
            </div>

            <select id="sort-select">
                <option value="date-desc">Сначала новые</option>
                <option value="date-asc">Сначала старые</option>
                <option value="priority">По приоритету</option>
            </select>
        </div>

        <!-- Список задач (Критерий: Динамический DOM) -->
        <ul id="todo-list" class="todo-list"></ul>
    </div>

    <!-- Модальное окно подтверждения удаления (Опциональный критерий) -->
    <div id="modal" class="modal hidden">
        <div class="modal-content">
            <p>Вы уверены, что хотите удалить задачу?</p>
            <button id="modal-confirm" class="btn-danger">Удалить</button>
            <button id="modal-close">Отмена</button>
        </div>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
